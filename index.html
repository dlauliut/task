<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="config.js"></script>
    <script src="js/task.js"></script>
    <script src="js/prayer.js"></script>
</head>

<body>

    <header>
        <h1>My Dashboard</h1>
    </header>

    <nav>
        <button onclick="showPage('task')">📋 Task</button>
        <button onclick="showPage('prayer')">🕌 Prayer</button>
    </nav>

    <main>

        <section id="taskPage" class="page">

            <div class="card">
                <h2>Task List</h2>

                <input type="text"
                    id="taskInput"
                    placeholder="Tambah task">

                <button onclick="addTask()">
                    Simpan
                </button>

                <ul id="taskList"></ul>

            </div>
        </section>

        <section id="prayerPage" class="page hidden">

            <div class="card">

                <h2>Jadwal Adzan</h2>

                <button onclick="loadPrayer()">
                    Ambil Lokasi
                </button>

                <div id="prayerResult"></div>

            </div>

        </section>

    </main>

    <script>

        function showPage(page) {

            document
                .getElementById("taskPage")
                .classList.add("hidden");

            document
                .getElementById("prayerPage")
                .classList.add("hidden");

            if (page === "task") {
                document
                    .getElementById("taskPage")
                    .classList.remove("hidden");
            }

            if (page === "prayer") {
                document
                    .getElementById("prayerPage")
                    .classList.remove("hidden");
            }
        }

    </script>

</body>

</html>
