<header>
    <h1>My Dashboard</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Task List</h2>

        <div class="task-form">

            <input
                id="taskInput"
                type="text"
                placeholder="Tambah task">

            <input
                id="deadlineInput"
                type="date">

            <button onclick="addTask()">
                Tambah
            </button>

        </div>

        <div id="taskList"></div>

    </div>

    <div class="card prayer-widget">

        <div class="widget-header">

            <h3>🕌 Jadwal Adzan</h3>

            <button onclick="loadPrayer()">
                Refresh
            </button>

        </div>

        <div id="prayerResult"></div>

    </div>

</div>
